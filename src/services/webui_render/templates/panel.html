<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{page_title}} · 花璃</title>
<link rel="stylesheet" href="/panel/static/panel.css?v={{css_rev}}">
<style>{{bg_rules}}</style>
</head>
<body class="{{body_class}}"{{inline_style}}>
<div class="bg-layer" aria-hidden="true"></div>
<a class="skip-link" href="#main-content">跳到正文</a>
<div class="panel-shell">
<aside class="desktop-sidebar" aria-label="侧栏">
<a class="brand" href="/panel">{{brand}}<span>花璃<small>FLOWERIE</small></span></a>
{{navigation}}
</aside>
<div class="workspace">
<header class="mobile-header">
<a class="brand" href="/panel">{{brand}}<span>花璃<small>FLOWERIE</small></span></a>
<details class="mobile-navigation">
<summary>导航 <span>当前：{{nav_current}}</span></summary>
{{navigation}}
</details>
</header>
<div class="wrap">
<main id="main-content" tabindex="-1">
<header class="page-heading">
<div>
<p class="page-eyebrow">{{page_eyebrow}}</p>
<h1 class="page-title">{{page_icon}}{{page_title}}</h1>
<p class="page-description">{{page_description}}</p>
</div>
{{page_art}}
</header>
{{msg_html}}
<div class="page-body page-{{page_key}}">{{body_html}}</div>
</main>
<footer class="panel-foot">花璃 · 管理后台 · 面板样式 #{{css_rev}}</footer>
</div>
</div>
</div>
</body>
</html>
