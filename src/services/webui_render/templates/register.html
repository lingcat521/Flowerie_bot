<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · 花璃</title>
<link rel="stylesheet" href="/panel/static/panel.css?v={{css_rev}}">
</head>
<body class="theme-dark auth-page">
<main class="auth-shell">
<div class="auth-brand" aria-hidden="true">
{{decoration}}
<p class="auth-brand-name">花璃 <span>FLOWERIE</span></p>
<p class="auth-tagline">让每一次连接，都井然有序。</p>
</div>
<section class="auth-card">
{{brand}}<h1>创建管理员账号</h1><p class="sub">注册仅在首次初始化时开放。创建账号后，公开注册将关闭。</p>
{{msg_html}}
<form method="post" action="/panel/register">
<div class="auth-field"><label for="register-username">新用户名（3~32 字符）</label><input id="register-username" name="username" type="text" required autocomplete="username"></div>
<div class="auth-field"><label for="register-password">新密码（至少 6 位）</label><input id="register-password" name="password" type="password" required autocomplete="new-password"></div>
<button type="submit" class="btn">注册首个管理员</button>
</form>
<p class="foot"><a href="/panel">返回登录</a></p>
</section>
</main>
</body>
</html>
