<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花璃 · 注册</title>
<link rel="stylesheet" href="/panel/static/panel.css?v={{css_rev}}">
</head>
<body class="theme-default" style="background-color:#F4F6FB">
<div class="auth-card">
<h2>首次注册管理员账号</h2>
<p class="sub">仅限首次搭建（系统未初始化时）。注册后公开注册永久关闭；账号密码以 scrypt 哈希安全保存在服务器，登录不再依赖 .env</p>
{{msg_html}}
<form method="post" action="/panel/register">
<label>新用户名（3~32 字符）</label><input name="username" type="text" required>
<label>新密码（至少 6 位）</label><input name="password" type="password" required>
<button type="submit" class="btn">注册首个管理员</button>
</form>
<p class="foot"><a href="/panel">← 返回登录</a></p>
</div>
</body>
</html>
