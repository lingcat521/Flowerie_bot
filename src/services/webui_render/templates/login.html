<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 花璃</title>
<link rel="stylesheet" href="/panel/static/panel.css?v={{css_rev}}">
</head>
<body class="theme-dark auth-page">
<main class="auth-shell">
<div class="auth-brand" aria-hidden="true">
{{decoration}}
<p class="auth-brand-name">花璃 <span>FLOWERIE</span></p>
<p class="auth-tagline">让每一次连接，都井然有序。</p>
</div>
<section class="auth-card">
{{brand}}<h1>登录管理后台</h1><p class="sub">使用管理员账号登录花璃。</p>
{{msg_html}}
<form method="post" action="/panel/login">
<div class="auth-field"><label for="login-username">用户名</label><input id="login-username" name="username" type="text" required autocomplete="username"></div>
<div class="auth-field"><label for="login-password">密码</label><input id="login-password" name="password" type="password" required autocomplete="current-password"></div>
<button type="submit" class="btn">登录</button>
</form>
<p class="foot"><a href="/panel/register">注册管理员账号</a></p>
</section>
</main>
</body>
</html>
