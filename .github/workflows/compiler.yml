name: Build Flowerie_bot

on:
  release:
    types: [created]
  # 手动重建资产：release 事件只在 release **创建**时触发，而 GitHub 的「Re-run」会复用
  # 原始事件的 commit（移动 tag 之后再 re-run 也不会构建新代码）。需要在已发布的 release 上
  # 重建资产时（例如 tag 已前移到新提交），用这个入口：
  #   gh workflow run compiler.yml --ref main -f tag=v2.3.0
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传资产的 Release tag（例如 v2.3.0）"
        required: true
        type: string

permissions:
  contents: write


jobs:


  build-desktop:


    strategy:
      fail-fast: false

      matrix:

        include:

          - os: ubuntu-latest
            name: linux-x64

          - os: ubuntu-24.04-arm
            name: linux-arm64

          - os: windows-latest
            name: windows-x64

          - os: windows-11-arm
            name: windows-arm64

          - os: macos-latest
            name: macos-arm64





    runs-on: ${{ matrix.os }}



    steps:


    - name: Checkout

      uses: actions/checkout@v5



    - name: Setup Python

      uses: actions/setup-python@v6

      with:

        python-version: "3.12"



    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        python -m pip install -r requirements.txt

        python -m pip install pyinstaller



    - name: Build builtin version
      shell: bash
      run: |
        # 面板的 CSS 与模板是真实文件，必须一并打进单文件包（PyInstaller --add-data）
        SEP=":"; if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
        D1="src/services/webui_render/static$SEP""src/services/webui_render/static"
        D2="src/services/webui_render/templates$SEP""src/services/webui_render/templates"
        python -m PyInstaller --onefile --name Flowerie_bot-${{ matrix.name }}-builtin \
          --add-data "$D1" --add-data "$D2" main.py



    - name: Build portable version
      shell: bash
      run: |
        SEP=":"; if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
        D1="src/services/webui_render/static$SEP""src/services/webui_render/static"
        D2="src/services/webui_render/templates$SEP""src/services/webui_render/templates"
        python -m PyInstaller --onedir --name Flowerie_bot-${{ matrix.name }}-portable \
          --add-data "$D1" --add-data "$D2" main.py





    #
    # Package output
    #

    - name: Package release files

      shell: python {0}

      run: |

        import os
        import shutil
        import zipfile
        from pathlib import Path


        name = "${{ matrix.name }}"

        dist = Path("dist")
        output = Path("output")

        output.mkdir(exist_ok=True)


        # Copy builtin executable

        for f in dist.glob(f"Flowerie_bot-{name}-builtin*"):

            shutil.copy(f, output / f.name)



        # Zip portable folder

        portable = dist / f"Flowerie_bot-{name}-portable"


        if portable.exists():

            archive = output / f"Flowerie_bot-{name}-portable.zip"

            with zipfile.ZipFile(
                archive,
                "w",
                zipfile.ZIP_DEFLATED
            ) as z:

                for file in portable.rglob("*"):

                    if file.is_file():

                        z.write(
                            file,
                            file.relative_to(dist)
                        )



    - name: Upload desktop artifact

      uses: actions/upload-artifact@v4

      with:

        name: Flowerie_bot-${{ matrix.name }}

        path: output/*





  #
  # Termux source package
  #

  build-termux:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout

      uses: actions/checkout@v5



    - name: Create Termux build script

      shell: bash

      run: |

        cat > build-termux.sh <<'EOF'

        #!/data/data/com.termux/files/usr/bin/bash

        set -e


        pkg update -y


        pkg install -y \
          python \
          clang \
          rust



        python -m pip install --upgrade pip



        python -m pip install \
          -r requirements.txt \
          -i https://termux-user-repository.github.io/pypi/ \
          --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple \
          --only-binary pydantic-core,pydantic



        python main.py

        EOF


        chmod +x build-termux.sh




    - name: Package Termux source

      shell: bash

      run: |


        mkdir package


        rsync -a \
          --exclude ".git" \
          --exclude ".github" \
          ./ \
          package/Flowerie_bot/



        tar -czf \
          Flowerie_bot-termux-source.tar.gz \
          -C package \
          Flowerie_bot




    - name: Upload Termux artifact

      uses: actions/upload-artifact@v4

      with:

        name: Flowerie_bot-termux-source

        path: Flowerie_bot-termux-source.tar.gz






  #
  # Release upload
  #

  release:


    needs:

      - build-desktop
      - build-termux



    runs-on: ubuntu-latest



    steps:


    - name: Download artifacts

      uses: actions/download-artifact@v4

      with:

        path: release




    - name: Upload release assets

      # 逐文件上传 + 重试：GitHub 偶发 500（Unicorn 错误页）会让 action-gh-release 整体中止，

      # 导致「资产其实传完了、job 却红」的假失败（2026-09-17 实际发生过两次）。

      env:

        GH_TOKEN: ${{ github.token }}

        TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      run: |

        set -u

        shopt -s nullglob

        files=(release/*/*.zip release/*/*.exe release/*/Flowerie_bot-*-builtin release/*/*.tar.gz)

        echo "待上传 ${#files[@]} 个文件"

        if [ "${#files[@]}" -lt 11 ]; then echo "::warning::只匹配到 ${#files[@]} 个文件（预期 11 个），请检查打包步骤"; fi

        fail=0

        for f in "${files[@]}"; do

          name=$(basename "$f")

          ok=0

          for attempt in 1 2 3 4 5; do

            if gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"; then ok=1; break; fi

            echo "⚠️ $name 第 $attempt 次上传失败，5 秒后重试"

            sleep 5

          done

          if [ "$ok" = "1" ]; then echo "✅ $name"; else echo "❌ $name 重试 5 次仍失败"; fail=1; fi

        done

        exit $fail
