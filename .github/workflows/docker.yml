# Docker 镜像构建与发布（tags + 手动触发）
# - 目标 1（Docker Hub）：lingcat/flowerie:latest + :<tag>（需仓库 secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）
# - 目标 2（GitHub 内置）：ghcr.io/lingcat521/flowerie:latest + :<tag>（GITHUB_TOKEN 免配置）
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Docker Hub)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lingcat/flowerie:latest
            lingcat/flowerie:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE }}:latest
            ghcr.io/${{ env.IMAGE }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
