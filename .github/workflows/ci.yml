name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖项目声明支持的最低版本（3.9）与当前主流版本（3.12）
        python-version: ["3.9", "3.12"]

    # PostgreSQL 服务（验证可选 PG 后端：Postgres*Repository 真跑 CRUD）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowerie
          POSTGRES_PASSWORD: flowerie
          POSTGRES_DB: flowerie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flowerie"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node.js 插件（minimal_node_plugin 端到端测试需要 node 可执行文件）
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff psycopg psycopg-pool

      # 多语言插件夹具：runner 镜像自带 gcc/g++/go/rust/java/kotlin/dotnet/php/ruby/perl/tsc，
      # 唯独缺 lua 与 R —— 补上这两个，13 种语言全部真实编译/启动（缺则用例自动 skip）
      - name: Install extra plugin toolchains (lua / R)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 r-base-core
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua

      - name: Ruff check
        run: ruff check .

      # 多语言 SDK 最小化插件实测（任务书《插件测试》§十五 语言矩阵）：
      # 真 build（go build / rustc / javac / tsc）-> 真加载 -> READY -> ping/echo/event ->
      # plugin.call 跨语言 -> 权限/错误 -> shutdown；-s 让 §十七 验收表与 §五 链路表打进 CI 日志。
      - name: SDK minimal plugin matrix (build/load/ping/echo/event/call/error/permission/shutdown)
        run: pytest -q -s tests/sdk/

      # Plugin WebUI 阶段（任务书《plugin_to_webui》§26/§31）：真 WebUIServer + 真 PluginManager + 真插件进程
      - name: Plugin WebUI (http / static / security / isolation / action / communication)
        run: pytest -q -s tests/webui/

      - name: Run tests (pytest)
        env:
          TEST_POSTGRES_URL: postgresql://flowerie:flowerie@127.0.0.1:5432/flowerie_test
        run: pytest -q -rs --ignore=tests/sdk --ignore=tests/webui --ignore=tests/e2e

  # 真浏览器 E2E（§8/§28）：Chromium + 真 WebUI 服务器 + 真插件进程。
  # 没有浏览器/工具链时必须 BLOCKED BY ENVIRONMENT（skip 并打印原因），绝不写 PASS。
  webui-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Plugin WebUI browser E2E (§8 DOM + §28 chains)
        run: pytest -q -rs -s tests/e2e/
